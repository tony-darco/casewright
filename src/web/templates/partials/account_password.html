{# Change password. Requires the current password; on success other sessions are
   signed out (token_version bump) and this session's cookie is re-issued. #}
<div id="accountPassword" class="account-block">
  <form class="auth-form account-form" hx-post="/account/password" hx-target="#accountPassword" hx-swap="outerHTML" autocomplete="off">
    <label>Current password
      <input class="set-input" type="password" name="current_password" required autocomplete="current-password"></label>
    <label>New password
      <input class="set-input" type="password" name="new_password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm new password
      <input class="set-input" type="password" name="new_password2" required minlength="8" autocomplete="new-password"></label>
    <div class="auth-hint">At least 8 characters.</div>
    <div class="account-actions">
      <button class="btn btn-primary" type="submit">Change password</button>
      {% if pw_msg %}<span class="account-msg"><b>&#10003;</b> {{ pw_msg }}</span>{% endif %}
    </div>
    {% if pw_error %}<div class="set-error" style="display:block"><b>&#10007;</b> {{ pw_error }}</div>{% endif %}
  </form>
</div>
