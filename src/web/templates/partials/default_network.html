{# Default example network picker (Run feature). Runs that build from an example clone
   this network unless a test overrides it. Replaces itself on save. #}
<form class="set-form" id="defaultNetForm"
      hx-post="/settings/meraki/default-network" hx-target="this" hx-swap="outerHTML"
      hx-disabled-elt="find button[type='submit']">
  <div class="gen-field">
    <label for="defaultNetSelect">Default example network</label>
    <select class="set-input" id="defaultNetSelect" name="networkId">
      <option value="">— none selected —</option>
      {% for n in networks %}
        <option value="{{ n.id }}"{% if n.id == default_network_id %} selected{% endif %}>{{ n.name }} ({{ n.orgName }})</option>
      {% endfor %}
    </select>
    <div class="set-hint">
      {% if saved %}<b>&#10003; Saved.</b> {% endif %}Runs that build from an example clone this network by default.
    </div>
    <button class="btn btn-primary" type="submit" style="margin-top:var(--s3)">Save default</button>
  </div>
</form>
