- id: dev-two-aps-status
  prompt: "Write a test that compares the SSID statuses of two access points, @ap-north and @ap-south, and confirms both report basic service sets."
  language: py
  needs_ap: true
  devices:
    - name: ap-north
      model: MR46
      serial: Q2PD-4444-DDDD
    - name: ap-south
      model: MR46
      serial: Q2PD-5555-EEEE
  expected_endpoints:
    - GET /devices/{serial}/wireless/status
  reference_script: |
    import os
    import requests

    BASE_URL = "https://api.meraki.com/api/v1"
    NORTH = "Q2PD-4444-DDDD"
    SOUTH = "Q2PD-5555-EEEE"
    HEADERS = {"X-Cisco-Meraki-API-Key": os.getenv("MERAKI_API_KEY")}


    def _statuses(serial):
        resp = requests.get(f"{BASE_URL}/devices/{serial}/wireless/status", headers=HEADERS)
        assert resp.status_code == 200
        return resp.json()


    def test_two_aps_report_bss():
        assert "basicServiceSets" in _statuses(NORTH)
        assert "basicServiceSets" in _statuses(SOUTH)
