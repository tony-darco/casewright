- id: ap-ssid-l3-firewall
  prompt: "Write a test that updates the L3 firewall rules for SSID 2 on an MR network and verifies the rules were saved."
  language: py
  needs_ap: true
  expected_endpoints:
    - PUT /networks/{networkId}/wireless/ssids/{number}/firewall/l3FirewallRules
    - GET /networks/{networkId}/wireless/ssids/{number}/firewall/l3FirewallRules
  reference_script: |
    import os
    import requests

    BASE_URL = "https://api.meraki.com/api/v1"
    NETWORK_ID = os.getenv("MERAKI_NETWORK_ID")
    HEADERS = {"X-Cisco-Meraki-API-Key": os.getenv("MERAKI_API_KEY"),
               "Content-Type": "application/json"}

    RULES = {"rules": [{"comment": "Block RFC1918", "policy": "deny",
                        "protocol": "any", "destPort": "Any", "destCidr": "10.0.0.0/8"}]}


    def test_update_ssid2_l3_firewall():
        url = f"{BASE_URL}/networks/{NETWORK_ID}/wireless/ssids/2/firewall/l3FirewallRules"
        updated = requests.put(url, headers=HEADERS, json=RULES)
        assert updated.status_code == 200

        confirmed = requests.get(url, headers=HEADERS)
        assert confirmed.status_code == 200
        comments = [r.get("comment") for r in confirmed.json()["rules"]]
        assert "Block RFC1918" in comments

