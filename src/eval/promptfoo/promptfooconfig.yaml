description: "Meraki wireless/camera retrieval eval (generated by sample_to_promptfoo.py)"

prompts:
  - "{{question}}"   # only the question reaches the pipeline -- expected_endpoints never leak

providers:
  # TODO(user): point this at your RAG pipeline's promptfoo provider.
  # e.g. a python provider: file://your_rag_provider.py
  # or an http provider hitting your retrieval endpoint.
  - id: "REPLACE_ME_WITH_YOUR_RAG_PROVIDER"

defaultTest:
  assert:
    - type: python
      value: file://score_retrieval.py
      metric: retrieval
      config:
        recall_threshold_for_pass: 1.0   # override the score_retrieval.py default here

derivedMetrics:
  # promptfoo derivedMetrics values are JS-style functions over namedScores,
  # aggregated across the whole suite.
  - name: precision
    value: "(namedScores) => namedScores.precision"
  - name: recall
    value: "(namedScores) => namedScores.recall"
  - name: f1_score
    value: "(namedScores) => (namedScores.precision + namedScores.recall) > 0 ? (2 * namedScores.precision * namedScores.recall) / (namedScores.precision + namedScores.recall) : 0"

tests: file://tests.yaml
