[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autotest"
version = "0.1.0"
requires-python = ">=3.10"
# Bounds track the versions the project is developed against (langchain 1.x line);
# refresh from `pip freeze` when upgrading.
dependencies = [
    "langchain-core>=1.4,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-chroma>=1.1,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.11,<3",
    "requests>=2.31,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    # encryption at rest for stored secrets (Meraki API key)
    "cryptography>=42,<47",
    # generic recursive-character chunking for the Knowledge Base feature's
    # "LangChain split" option (custom split reuses rag.ingest.split directly)
    "langchain-text-splitters>=1.0,<2",
    # ephemeral container execution for the Run feature (test runners)
    "docker>=7,<8",
    # TUI front-end (uses only web.services, never rag/web-serving directly)
    "textual>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
casewright = "tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
