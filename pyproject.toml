[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autotest"
version = "0.1.0"
requires-python = ">=3.10"
# Bounds track the versions the project is developed against (langchain 1.x line);
# refresh from `pip freeze` when upgrading.
dependencies = [
    "langchain-core>=1.4,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-chroma>=1.1,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.11,<3",
    "requests>=2.31,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    # web serving layer (frontend/UX per docs/FRONTEND_HANDOFF.md)
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    # auth: JWT sessions + password hashing
    "pyjwt>=2.8,<3",
    "bcrypt>=4.1,<5",
    # encryption at rest for stored secrets (Meraki API key)
    "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
